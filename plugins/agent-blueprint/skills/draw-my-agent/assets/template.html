<meta charset="utf-8">
<title>Draw My Agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one sheet per agent. What it reads enters left, what it changes leaves right, five plain questions sit below. System fonts only, so the file makes no network requests. */
:root {
  --bg: #E7EDF4; --paper: #F7FAFD; --grid: rgba(29,79,145,.06); --grid-major: rgba(29,79,145,.11);
  --ink: #1D4F91; --ink-faint: rgba(29,79,145,.16); --text: #12233A; --muted: #5A6B82;
  --change: #C2410C; --gate: #8F5A06; --gate-bg: #FFF3D9; --alert: #B42318; --alert-bg: #FDECEA; --good: #2F7D4F; --good-bg: #E6F4EC;
  --display: "Avenir Next Condensed", "DIN Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #081525; --paper: #0E2138; --grid: rgba(169,203,255,.05); --grid-major: rgba(169,203,255,.09);
    --ink: #A9CBFF; --ink-faint: rgba(169,203,255,.18); --text: #E6EEF8; --muted: #93A6BF;
    --change: #FF8F5E; --gate: #F2C14E; --gate-bg: #29343B; --alert: #FF8A80; --alert-bg: #3A2730; --good: #74D39C; --good-bg: #1C3A36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #081525; --paper: #0E2138; --grid: rgba(169,203,255,.05); --grid-major: rgba(169,203,255,.09);
  --ink: #A9CBFF; --ink-faint: rgba(169,203,255,.18); --text: #E6EEF8; --muted: #93A6BF;
  --change: #FF8F5E; --gate: #F2C14E; --gate-bg: #29343B; --alert: #FF8A80; --alert-bg: #3A2730; --good: #74D39C; --good-bg: #1C3A36;
  color-scheme: dark;
}
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.top > div { min-width: 0; }
.eyebrow { font: 600 13px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
h1 { margin: 2px 0 0; font: 700 clamp(30px, 5vw, 44px)/1.05 var(--display); text-wrap: balance; }
.headline { margin: 6px 0 0; max-width: 70ch; font-size: 17px; }
.side { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.theme { font: 600 13px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.theme:hover { border-color: var(--ink); }
.note { font: 12px var(--mono); color: var(--muted); border: 1px dashed var(--ink-faint); border-radius: 4px; padding: 6px 10px; }
.try { display: grid; gap: 8px; padding: 16px 18px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; }
.try-k { font: 600 12.5px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
.try-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.try-line { flex: 1 1 320px; min-width: 0; font: 14px var(--mono); padding: 9px 12px; background: var(--bg); border-radius: 4px; overflow-wrap: anywhere; }
.copy { font: 600 13px var(--body); color: var(--paper); background: var(--ink); border: 1px solid var(--ink); border-radius: 4px; padding: 8px 14px; cursor: pointer; }
.totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; }
.total { padding: 13px 18px; min-width: 0; }
.total + .total { border-left: 1px solid var(--ink-faint); }
.total-v { font: 700 30px/1.1 var(--display); }
.total-k { font-size: 13.5px; color: var(--muted); }
.scroll { overflow-x: auto; border-radius: 6px; background: var(--paper); }
.sheet { display: block; width: 100%; min-width: 880px; height: auto; }
.frame-o { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.frame-i { fill: url(#gm); stroke: var(--ink); stroke-width: .8; }
.gl1 { fill: none; stroke: var(--grid); }
.gl2 { fill: none; stroke: var(--grid-major); }
.t-head { font: 600 12px var(--display); letter-spacing: .18em; fill: var(--ink); }
.t-label { font: 500 14px var(--body); fill: var(--text); }
.t-small { font: 400 12px var(--body); fill: var(--muted); }
.t-name { font: 700 23px var(--display); fill: var(--text); }
.t-gate { font: 600 12px var(--body); fill: var(--gate); }
.t-no { font: 600 12px var(--body); fill: var(--alert); }
.t-k { font: 500 8.5px var(--mono); letter-spacing: .12em; fill: var(--muted); }
.t-v { font: 500 12px var(--mono); fill: var(--text); }
.t-title { font: 700 14px var(--display); letter-spacing: .2em; fill: var(--ink); }
.t-yes { font: 600 12px var(--body); fill: var(--change); }
.t-q { font: 700 15px var(--body); fill: var(--paper); }
.machine { fill: var(--paper); stroke: var(--ink); stroke-width: 2.2; }
.machine-in { fill: none; stroke: var(--ink-faint); stroke-dasharray: 3 4; }
.rule { stroke: var(--ink-faint); }
.port { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; }
.port.c { stroke: var(--change); }
.p-read { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-dasharray: 6 5; }
.p-change { fill: none; stroke: var(--change); stroke-width: 2.6; stroke-linecap: round; }
.ring { fill: var(--paper); stroke: var(--ink); stroke-width: 1.8; }
.ring.c { stroke: var(--change); }
.ico { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ico.c { stroke: var(--change); }
.ico.g { stroke: var(--gate); }
.pill { fill: var(--gate-bg); stroke: var(--gate); stroke-width: 1.5; }
.pill-no { fill: var(--alert-bg); stroke: var(--alert); stroke-width: 1.5; }
.pill-q { fill: var(--paper); stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 3 3; }
.yes { fill: var(--change); }
.none { fill: var(--paper); stroke: var(--muted); stroke-width: 2; }
.slash { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.q { fill: var(--muted); }
.t-q.small { font-size: 11px; }
.box { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
.line { stroke: var(--ink); stroke-width: .8; }
.hit { cursor: pointer; outline: none; }
.hl { fill: transparent; transition: fill .15s; }
.hit:hover .hl, .hit.on .hl { fill: var(--ink-faint); }
.hit:focus-visible .hl { fill: var(--ink-faint); stroke: var(--ink); stroke-dasharray: 3 3; }
.panel { display: grid; gap: 6px; padding: 16px 20px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; min-width: 0; }
.panel-k { font: 600 12.5px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
.panel-t { margin: 0; font-size: 16px; max-width: 75ch; }
.panel-s { margin: 0; font: 12.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.power { margin: 0; font-size: 14.5px; max-width: 110ch; }
.power b { font-weight: 600; color: var(--change); }
.foot { margin: 0; font-size: 13px; color: var(--muted); max-width: 90ch; }
.tool { display: grid; gap: 12px; padding: 18px 20px; background: var(--paper); border: 1px solid var(--ink-faint); border-radius: 6px; min-width: 0; }
.tool h2 { margin: 0; font: 700 24px/1.15 var(--display); }
.tool-sub { margin: 0; max-width: 75ch; color: var(--muted); }
.check { display: flex; align-items: baseline; gap: 10px; cursor: pointer; }
.check input { flex: none; }
.check small { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.checks { display: grid; gap: 7px; }
details { border-top: 1px solid var(--ink-faint); padding-top: 10px; }
summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.rule-rows { display: grid; gap: 6px; margin-top: 10px; }
.rule-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; padding: 6px 0; border-bottom: 1px solid var(--ink-faint); }
.rule-row label { min-width: 0; overflow-wrap: anywhere; }
.rule-row small { color: var(--muted); }
select { font: 14px var(--body); color: var(--text); background: var(--bg); border: 1px solid var(--ink-faint); border-radius: 4px; padding: 5px 8px; }
.rules-out { width: 100%; box-sizing: border-box; min-height: 270px; resize: vertical; font: 13px/1.5 var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--ink-faint); border-radius: 4px; padding: 10px 12px; }
.tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.copy[disabled] { opacity: .45; cursor: not-allowed; }
.plain { font: 600 13px var(--body); color: var(--ink); background: transparent; border: 1px solid var(--ink-faint); border-radius: 4px; padding: 7px 13px; cursor: pointer; }
.warn { margin: 0; padding: 9px 12px; font-size: 14px; background: var(--gate-bg); color: var(--text); border-left: 3px solid var(--gate); border-radius: 3px; max-width: 80ch; }
.items { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.items li { min-width: 0; overflow-wrap: anywhere; }
.tag { display: inline-block; margin-right: 8px; padding: 1px 8px; font-size: 12px; font-weight: 600; color: var(--gate); background: var(--gate-bg); border-radius: 999px; }
.item-names { display: block; font: 12.5px var(--mono); color: var(--muted); }
.big { font-weight: 600; color: var(--change); }
input[type=file] { max-width: 100%; font: 14px var(--body); color: var(--muted); }
@media (max-width: 640px) { .totals { grid-template-columns: minmax(0, 1fr); } .total + .total { border-left: none; border-top: 1px solid var(--ink-faint); } }
</style>

<main class="wrap" id="app"></main>

<script id="blueprint" type="application/json">
{
  "version": "0.2",
  "demo": true,
  "agent": { "name": "Sam's assistant", "product": "A coding agent on a laptop", "model": "Example model" },
  "drawn": "2026-10-30",
  "connections": [
    { "name": "This computer", "icon": "terminal", "basis": "judged", "asks": true, "risk": "high",
      "reads": ["read_file", "list_folder", "search_files"], "changes": ["write_file", "edit_file", "run_command"], "unsure": [] },
    { "name": "Gmail", "icon": "mail", "basis": "judged", "asks": false,
      "reads": ["search_threads", "get_thread", "list_labels"], "changes": ["send_message", "reply", "create_draft", "trash_message", "label_thread"], "unsure": [] },
    { "name": "GitHub", "icon": "code", "basis": "declared", "asks": true,
      "reads": ["list_issues", "get_pull_request", "search_code", "get_file"], "changes": ["create_issue", "comment", "merge_pull_request", "push_files"], "unsure": [] },
    { "name": "Slack", "icon": "chat", "basis": "declared", "asks": false,
      "reads": ["read_channel", "search_messages"], "changes": ["send_message", "add_reaction"], "unsure": [] },
    { "name": "Calendar", "icon": "calendar", "basis": "declared", "asks": null,
      "reads": ["list_events", "suggest_time"], "changes": ["create_event", "delete_event"], "unsure": [] },
    { "name": "Notion", "icon": "doc", "basis": "judged", "asks": null,
      "reads": ["search", "get_page"], "changes": ["update_page", "sync_workspace"], "unsure": ["sync_workspace"] },
    { "name": "The web", "icon": "web", "basis": "declared", "asks": null,
      "reads": ["web_search", "fetch_page"], "changes": [], "unsure": [] }
  ],
  "checks": {
    "commands": { "status": "yes", "evidence": "This computer: run_command can run commands." },
    "messages": { "status": "yes", "evidence": "Gmail send_message and Slack send_message post as Sam." },
    "delete": { "status": "yes", "evidence": "Gmail trash_message and Calendar delete_event remove things." },
    "money": { "status": "none_found", "evidence": "No payment or purchasing tools are listed." },
    "secrets": { "status": "unsure", "evidence": "read_file can open any local file, which may include keys." }
  },
  "unseen": "It can't see which account each connection signs in with, or what a tool really does behind its description.",
  "trim": [
    { "name": "Notion", "kind": "duplicate", "tools": 4, "why": "It's connected twice, once directly and once through a plug-in. Keep either one." },
    { "name": "Web search", "kind": "overlap", "tools": 2, "why": "GitHub search_code and The web both find code online. It can't tell which Sam prefers." }
  ]
}
</script>

<script>
(function () {

    u.setAttribute("href", "#i-" + (known.indexOf(name) >= 0 ? name : "plug"));
  }

    var s = list.filter(function (c) { return c[key].length; }).sort(function (a, b) {
      function rank(c) { return key !== "changes" ? 3 : c.risk === "high" && c.icon === "terminal" ? 0 : c.icon === "mail" || c.icon === "chat" ? 1 : c.risk === "high" ? 2 : 3; }

    });

  var tb = h("button", "theme", side);

  function dark() { var t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; }

  tb.addEventListener("click", function () { document.documentElement.setAttribute("data-theme", dark() ? "light" : "dark"); tl(); });

  h("div", "note", side, data.demo ? "EXAMPLE" + DOT + "made-up agent" : "Stays on this computer");

  if (data.demo) {
    var t = h("section", "try", app);
    h("div", "try-k", t, "Try it on your agent");

  [[nReads, "actions that only read"], [nChanges, "actions that change things"], [nMust, "confirmed to ask you first"]].forEach(function (x) {
    var d = h("div", "total", tot);
    h("div", "total-v", d, String(x[0]));
    h("div", "total-k", d, x[1]);

  var power = conns.filter(function (c) { return c.risk === "high"; }).map(function (c) { return c.name; });
  if (power.length) {
    var pw = h("p", "power", app);
    h("b", null, pw, "Most powerful: ");

  el("rect", { "class": "frame-o", x: 16, y: 16, width: 1168, height: 678 }, svg);

  function hl2(g, x, y, w, ht) { el("rect", { "class": "hl", x: x, y: y, width: w, height: ht, rx: 6 }, g); }
